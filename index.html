<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Admin - Key Generator</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            margin: 0;
        }
        .admin-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid #334155;
            text-align: center;
        }
        h2 { color: #38bdf8; margin-bottom: 25px; }
        
        /* ইনপুট ও বাটন স্টাইল */
        .input-box {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #38bdf8;
            font-weight: bold;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        .input-box:focus { border-color: #38bdf8; }

        .btn {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #0f172a;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* প্যানেল সেকশন (লগইন এর আগে লুকানো থাকবে) */
        #generator-section { display: none; margin-top: 20px; }
        
        .key-list {
            margin-top: 25px;
            background: rgba(15, 23, 42, 0.8);
            padding: 15px;
            border-radius: 12px;
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
            border: 1px solid #334155;
        }
        .key-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #334155;
            font-size: 13px;
        }
        .status-active { color: #22c55e; font-weight: bold; }
        .status-used { color: #ef4444; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Admin Dashboard</h2>

    <div id="login-section">
        <p style="color: #94a3b8;">অ্যাডমিন প্যানেলে প্রবেশ করতে পাসওয়ার্ড দিন</p>
        <input type="password" id="admin-pass" class="input-box" placeholder="পাসওয়ার্ড লিখুন...">
        <button class="btn" onclick="verifyAdmin()">লগইন করুন</button>
    </div>

    <div id="generator-section">
        <p style="color: #94a3b8; font-size: 14px;">নতুন কী (Key) তৈরি করুন</p>
        <input type="text" id="new-key" class="input-box" placeholder="উদা: GOPAL-VIP-505">
        <button class="btn" onclick="generateKey()">ডাটাবেসে সেভ করুন</button>

        <div class="key-list" id="key-display">
            <p style="text-align: center; color: #64748b;">লোড হচ্ছে...</p>
        </div>
        
        <button class="btn" style="margin-top: 15px; background: #334155; color: white;" onclick="location.reload()">লগ আউট</button>
    </div>
</div>

<script>
    // আপনার Firebase কনফিগারেশন
    const firebaseConfig = {
        apiKey: "AIzaSyCx3LLV88dkBKXj4nvHNSLtc3GJSNbcYbM",
        authDomain: "wingohack-36674.firebaseapp.com",
        projectId: "wingohack-36674",
        databaseURL: "https://wingohack-36674-default-rtdb.firebaseio.com",
        storageBucket: "wingohack-36674.firebasestorage.app",
        messagingSenderId: "344636000633",
        appId: "1:344636000633:web:63a06f019b4e35ec4647a8"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ১. অ্যাডমিন পাসওয়ার্ড ভেরিফিকেশন
    function verifyAdmin() {
        const passInput = document.getElementById('admin-pass').value;
        const correctPass = "@DEV_GOPAL"; // আপনার কাঙ্ক্ষিত পাসওয়ার্ড

        if (passInput === correctPass) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('generator-section').style.display = 'block';
            loadKeys(); // পাসওয়ার্ড সঠিক হলে ডাটা লোড হবে
        } else {
            alert("ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।");
        }
    }

    // ২. নতুন কী জেনারেট করা
    function generateKey() {
        const keyVal = document.getElementById('new-key').value.trim();
        if (!keyVal) {
            alert("দয়া করে একটি কী লিখুন!");
            return;
        }

        db.ref('keys/' + keyVal).set({
            status: "active",
            created_at: new Date().toLocaleString(),
            used_by: null
        }).then(() => {
            alert("কী সফলভাবে অ্যাড হয়েছে!");
            document.getElementById('new-key').value = "";
        }).catch((e) => alert("Error: " + e.message));
    }

    // ৩. ডাটাবেস থেকে কী লিস্ট লোড করা
    function loadKeys() {
        db.ref('keys').on('value', (snapshot) => {
            const display = document.getElementById('key-display');
            display.innerHTML = "<strong style='color:#38bdf8'>বর্তমান কী লিস্ট:</strong><br><br>";
            
            if (!snapshot.exists()) {
                display.innerHTML += "<p style='color:#64748b'>কোনো কী পাওয়া যায়নি।</p>";
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const keyName = childSnapshot.key;
                const data = childSnapshot.val();
                const statusClass = data.status === 'active' ? 'status-active' : 'status-used';
                
                display.innerHTML += `
                    <div class="key-item">
                        <span>${keyName}</span>
                        <span class="${statusClass}">${data.status.toUpperCase()}</span>
                    </div>
                `;
            });
        });
    }
</script>

</body>
</html>
