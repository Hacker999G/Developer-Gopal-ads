<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MonetCash Bot</title>
    <script src='//libtl.com/sdk.js' data-zone='10320222' data-sdk='show_10320222'></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --primary-color: #00b894;
            --bg-dark: #1e272e;
            --card-bg: #2f3640;
            --text-light: #f5f6fa;
            --accent-orange: #f0932b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), #00cec9);
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .balance-card {
            background: var(--card-bg);
            margin: -30px 20px 20px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border: 1px solid #3d4a5d;
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .btn {
            display: block;
            width: 80%;
            margin: 20px auto;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            text-decoration: none;
        }

        .btn-primary { background: var(--primary-color); color: white; }
        .btn-withdraw { background: var(--accent-orange); color: white; }

        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #3d4a5d;
        }

        .nav-item { color: #84817a; text-decoration: none; font-size: 0.8rem; text-align: center; }
        .nav-item.active { color: var(--primary-color); }

        .input-group { padding: 20px; }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #4b6584;
            background: #1e272e;
            color: white;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2>MonetCash Bot</h2>
        <p>সহজে আয় করুন এবং বিকাশ/নগদে নিন</p>
    </div>

    <div class="balance-card">
        <p>আপনার ব্যালেন্স</p>
        <div class="balance-amount">৳ <span id="userBalance">0.00</span></div>
        <p style="font-size: 0.8rem; color: #aaa;">১০০ টাকা হলে উইথড্র</p>
    </div>

    <div id="pageContent">
        <div class="stats-grid">
            <div class="stat-box">
                <h4 id="todayAds">0</h4>
                <p>আজকের অ্যাড</p>
            </div>
            <div class="stat-box">
                <h4 id="totalRefer">0</h4>
                <p>মোট রেফার</p>
            </div>
        </div>
        <button class="btn btn-primary" onclick="showAd()">
            <i class="fas fa-play"></i> অ্যাড দেখে আয় করুন (০.০১ টাকা)
        </button>
        <p style="text-align: center; padding: 10px;">রেফার লিঙ্ক শেয়ার করে ১ টাকা আয় করুন!</p>
    </div>

    <nav class="nav-bar">
        <a href="#" class="nav-item active" onclick="loadPage('home')"><i class="fas fa-home"></i><br>হোম</a>
        <a href="#" class="nav-item" onclick="loadPage('withdraw')"><i class="fas fa-wallet"></i><br>উইথড্র</a>
        <a href="#" class="nav-item" onclick="loadPage('refer')"><i class="fas fa-users"></i><br>রেফার</a>
    </nav>
</div>

<script>
    // --- Configuration ---
    const BOT_TOKEN = "7644363174:AAECg4TCBKu1Os5bX_mGqJwct2UkgXqunfY";
    const ADMIN_ID = "8533946494";
    const AD_REDIRECT_URL = "https://omg10.com/4/6765363";
    const MIN_WITHDRAW = 100;
    
    let userData = JSON.parse(localStorage.getItem('monetCashUser')) || {
        balance: 0.0,
        todayAds: 0,
        totalRefers: 0,
        userId: Math.floor(100000 + Math.random() * 900000)
    };

    function updateUI() {
        document.getElementById('userBalance').innerText = userData.balance.toFixed(2);
        if(document.getElementById('todayAds')) document.getElementById('todayAds').innerText = userData.todayAds;
        if(document.getElementById('totalRefer')) document.getElementById('totalRefer').innerText = userData.totalRefers;
        localStorage.setItem('monetCashUser', JSON.stringify(userData));
    }

    // --- Ad Function ---
    function showAd() {
        if (typeof show_10320222 === 'function') {
            show_10320222().then(() => {
                userData.balance += 0.01;
                userData.todayAds += 1;
                updateUI();
                alert('অভিনন্দন! আপনি ০.০১ টাকা পেয়েছেন।');
                window.location.href = AD_REDIRECT_URL;
            }).catch(e => {
                alert('অ্যাড লোড হয়নি, আবার চেষ্টা করুন।');
            });
        } else {
            alert('অ্যাড সার্ভিস লোড হচ্ছে, কিছুক্ষণ পর চেষ্টা করুন।');
        }
    }

    // --- Withdrawal ---
    function handleWithdraw(e) {
        e.preventDefault();
        const amount = parseFloat(document.getElementById('amount').value);
        const method = document.getElementById('method').value;
        const number = document.getElementById('number').value;

        if (amount < MIN_WITHDRAW) return alert(`মিনিমাম উইথড্র ${MIN_WITHDRAW} টাকা`);
        if (amount > userData.balance) return alert('আপনার পর্যাপ্ত ব্যালেন্স নেই');

        const msg = `🔔 *New Withdrawal Request*\n\nUser ID: ${userData.userId}\nAmount: ${amount} TK\nMethod: ${method}\nNumber: ${number}\n\nBalance Left: ${(userData.balance - amount).toFixed(2)} TK`;
        
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`)
        .then(() => {
            userData.balance -= amount;
            updateUI();
            alert('আপনার উইথড্র রিকোয়েস্ট অ্যাডমিনের কাছে পাঠানো হয়েছে।');
            loadPage('home');
        });
    }

    // --- Navigation ---
    function loadPage(page) {
        const content = document.getElementById('pageContent');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        
        if (page === 'home') {
            content.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-box"><h4 id="todayAds">${userData.todayAds}</h4><p>আজকের অ্যাড</p></div>
                    <div class="stat-box"><h4 id="totalRefer">${userData.totalRefers}</h4><p>মোট রেফার</p></div>
                </div>
                <button class="btn btn-primary" onclick="showAd()">অ্যাড দেখে আয় করুন (০.০১ টাকা)</button>
            `;
        } else if (page === 'withdraw') {
            content.innerHTML = `
                <div class="input-group">
                    <h3>টাকা তুলুন</h3>
                    <form onsubmit="handleWithdraw(event)">
                        <input type="number" id="amount" placeholder="পরিমাণ (টাকা)" required>
                        <select id="method" required>
                            <option value="Bikash">বিকাশ</option>
                            <option value="Nagad">নগদ</option>
                        </select>
                        <input type="text" id="number" placeholder="বিকাশ/নগদ নাম্বার" required>
                        <button type="submit" class="btn btn-withdraw">উইথড্র রিকোয়েস্ট দিন</button>
                    </form>
                </div>
            `;
        } else if (page === 'refer') {
            const refLink = `https://t.me/MonetCashV1?start=${userData.userId}`;
            content.innerHTML = `
                <div class="input-group" style="text-align:center">
                    <h3>আপনার রেফার লিঙ্ক</h3>
                    <input type="text" value="${refLink}" readonly id="refLink">
                    <button class="btn btn-primary" onclick="copyRef()">লিঙ্ক কপি করুন</button>
                    <p>প্রতি রেফারে পাবেন ১.০০ টাকা!</p>
                </div>
            `;
        }
        updateUI();
    }

    function copyRef() {
        const copyText = document.getElementById("refLink");
        copyText.select();
        document.execCommand("copy");
        alert("লিঙ্ক কপি হয়েছে!");
    }

    window.onload = updateUI;
</script>

</body>
</html>
